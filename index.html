<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T5 Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Phosphor Icons for a clean, modern look -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        :root {
            --bg-color: #ffffff;
            --text-main: #0f0f0f;
            --text-muted: #828282;
            --accent: #4f46e5; /* Indigo — clean & professional */
            --accent-light: #6366f1;
            --accent-bg: #eef2ff;
            --input-bg: #f4f4f4;
            --border-color: #e5e5e5;
            --user-bubble: #f4f4f4;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        .chat-layout { 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        .header {
            padding: 16px 24px;
            font-weight: 500;
            font-size: 16px;
            letter-spacing: -0.01em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid transparent;
            transition: border-bottom 0.2s;
        }

        .header .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent-bg);
            color: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .messages { 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 24px 20px 48px; 
            display: flex; 
            flex-direction: column; 
            gap: 32px; 
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            color: var(--text-main);
            gap: 20px;
        }

        .empty-state h1 {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin: 0;
            color: var(--text-main);
        }

        .empty-state p {
            font-size: 15px;
            color: var(--text-muted);
            margin: 0;
            max-width: 400px;
            text-align: center;
            line-height: 1.6;
        }

        .empty-logo {
            width: 48px;
            height: 48px;
            background: var(--accent-bg);
            color: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }

        .message { 
            display: flex; 
            gap: 16px; 
            max-width: 100%;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* User Message styling */
        .message.user {
            justify-content: flex-end;
            margin-left: 48px;
        }
        .message.user .content-wrapper {
            background-color: var(--user-bubble);
            padding: 12px 18px;
            border-radius: 18px;
            border-bottom-right-radius: 4px;
            max-width: 100%;
        }

        /* Assistant Message styling */
        .message.assistant {
            justify-content: flex-start;
            margin-right: 48px;
        }
        
        .avatar { 
            width: 28px; 
            height: 28px; 
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 600; 
            flex-shrink: 0; 
            font-size: 14px; 
            margin-top: 4px;
        }
        .avatar.assistant { 
            background-color: transparent; 
            color: var(--accent); 
        }

        .content-wrapper {
            max-width: 100%;
            line-height: 1.6;
            font-size: 16px;
        }

        .message.assistant .content-wrapper {
            padding-top: 5px;
        }

        .summary-meta {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .summary-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-wrapper {
            padding: 0 20px 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 30%);
            position: relative;
        }
        
        .input-container-inner {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .input-box {
            position: relative;
            background: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        
        .input-box:focus-within {
            background: white;
            border-color: var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            min-height: 44px;
        }

        textarea { 
            flex: 1; 
            border: none; 
            outline: none; 
            resize: none; 
            max-height: 200px; 
            min-height: 24px; 
            padding: 10px 12px; 
            font-family: inherit; 
            font-size: 16px; 
            background: transparent; 
            line-height: 1.5;
            color: var(--text-main);
        }
        textarea::placeholder { color: #a1a1aa; }

        .btn-send {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            margin: 4px;
            font-size: 18px;
        }
        .btn-send:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-send:disabled {
            background: #e5e5e5;
            color: white;
            cursor: not-allowed;
        }

        .footer-note {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 12px;
        }

        /* Markdown styling inside content */
        .markdown { word-break: break-word; }
        .markdown p { margin-bottom: 1em; }
        .markdown p:last-child { margin-bottom: 0; }
        .markdown a { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
        .markdown pre { 
            background: #f9f9f9; 
            border: 1px solid var(--border-color);
            color: var(--text-main); 
            padding: 16px; 
            border-radius: 12px; 
            overflow-x: auto; 
            margin-bottom: 1em; 
            font-size: 14px;
        }
        .markdown code { 
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; 
            font-size: 14px; 
            background: #f4f4f4; 
            padding: 3px 6px; 
            border-radius: 6px; 
            color: var(--accent);
        }
        .markdown pre code { background: transparent; padding: 0; color: inherit; }
        .markdown ul, .markdown ol { margin-bottom: 1em; padding-left: 20px; }
        
        .loading-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            height: 24px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
    </style>
</head>
<body>
    <div class="chat-layout">
        <div class="header">
            <div class="logo-icon">
                <i class="ph ph-diamond"></i>
            </div>
            T5 Summarizer
        </div>
        
        <div class="messages-container" id="messages-container">
            <div class="messages" id="messages">
                <div class="empty-state" id="empty-state">
                    <div class="empty-logo">
                        <i class="ph ph-diamond"></i>
                    </div>
                    <h1>What can I help you with?</h1>
                    <p>Paste an article, essay, or any long text and I'll generate a concise summary for you.</p>
                </div>
            </div>
        </div>
        
        <div class="input-wrapper">
            <div class="input-container-inner">
                <div class="input-box">
                    <div class="input-row">
                        <textarea id="user-input" rows="1" placeholder="Paste your text to summarize..." onkeydown="handleKeydown(event)" oninput="autoResize(this)"></textarea>
                        <button class="btn-send" id="send-btn" onclick="sendMessage()" disabled>
                            <i class="ph-bold ph-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="footer-note">
                T5 Summarizer powered by a fine-tuned T5 model. Results may vary.
            </div>
        </div>
    </div>

    <script>
        // ──────────────────────────────────────────────
        // CONFIG — change this if your API runs elsewhere
        // ──────────────────────────────────────────────
        const API_BASE = window.location.origin;   // e.g. http://localhost:8000
        const SUMMARIZE_ENDPOINT = `${API_BASE}/summarize`;

        // Simple markdown configuration
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        window.autoResize = function(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
            
            const btn = document.getElementById('send-btn');
            btn.disabled = !textarea.value.trim();
        };

        window.handleKeydown = function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!document.getElementById('send-btn').disabled) {
                    sendMessage();
                }
            }
        };

        function scrollToBottom() {
            const container = document.getElementById('messages-container');
            container.scrollTop = container.scrollHeight;
        }

        function addMessage(role, text) {
            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.style.display = 'none';

            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            let contentStr = '';

            if (role === 'assistant') {
                contentStr = `<div class="avatar assistant"><i class="ph-fill ph-diamond" style="font-size: 20px;"></i></div>`;
                contentStr += `<div class="content-wrapper">`;
                if (text === 'loading') {
                    contentStr += `<div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
                } else {
                    contentStr += `<div class="markdown">${marked.parse(text)}</div>`;
                }
                contentStr += `</div>`;
            } else {
                contentStr += `<div class="content-wrapper">`;
                if (text) {
                    contentStr += `<div style="white-space: pre-wrap;">${escapeHtml(text)}</div>`;
                }
                contentStr += `</div>`;
            }

            msgDiv.innerHTML = contentStr;
            messagesDiv.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        window.sendMessage = async function() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            
            if (!text) return;

            // Validate minimum length (API requires min 10 chars)
            if (text.length < 10) {
                input.style.outline = '2px solid #ef4444';
                input.style.borderRadius = '12px';
                setTimeout(() => { input.style.outline = 'none'; }, 2000);
                return;
            }

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            input.disabled = true;

            // Display user message
            addMessage('user', text);
            
            const textToSend = text;

            // Clear input
            input.value = '';
            input.style.height = 'auto';

            // Add loading placeholder for assistant
            const typingDiv = addMessage('assistant', 'loading');

            try {
                const response = await fetch(SUMMARIZE_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: textToSend,
                        max_length: 150,
                        min_length: 30
                    })
                });

                if (!response.ok) {
                    const errBody = await response.json().catch(() => ({}));
                    throw new Error(errBody.detail || `HTTP ${response.status}`);
                }

                const data = await response.json();

                // Replace typing element with actual summary + metadata
                const wrapper = typingDiv.querySelector('.content-wrapper');
                let html = `<div class="markdown">${marked.parse(data.summary)}</div>`;

                // Show input / output length metadata
                html += `<div class="summary-meta">
                    <span><i class="ph ph-text-align-left"></i> ${data.input_length} chars in</span>
                    <span><i class="ph ph-text-align-right"></i> ${data.output_length} chars out</span>
                </div>`;

                wrapper.innerHTML = html;

            } catch (err) {
                console.error(err);
                typingDiv.querySelector('.content-wrapper').innerHTML = `
                    <div class="markdown" style="color: #ef4444;">
                        Something went wrong: ${escapeHtml(err.message)}<br>
                        <small style="color: var(--text-muted);">Make sure the FastAPI backend is running.</small>
                    </div>`;
            } finally {
                sendBtn.disabled = false;
                input.disabled = false;
                input.focus();
                autoResize(input);
                scrollToBottom();
            }
        };
    </script>
</body>
</html>
